test_name: Teste de API

marks:
  - parametrize:
      key: todo_id
      vals:
        - 1
        - 5
        - 15


stages:
  - name: Estágio 1 - Busca de Tarefa Específica
    request:
      url: "https://jsonplaceholder.typicode.com/todos/{todo_id}"
      method: GET

    response:
      status_code: 200
      save:
        json:
          id_do_usuario: userId


  - name: Estágio 2 - Busca de todas as Tarefas do Usuário
    request:
      url: "https://jsonplaceholder.typicode.com/todos?userId={id_do_usuario}"
      method: GET

    response:
      status_code: 200
      verify_response_with:
        function: utils:validar_lista_tarefas